name: Test

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run test:syntax
      - run: pnpm test
      - uses: browser-actions/setup-chrome@v1
        if: matrix.node == 24
        id: chrome
        with:
          chrome-version: '157'
      - run: pnpm run test:browser
        if: matrix.node == 24
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
      - name: Show failing browser log
        if: failure()
        run: node scripts/show-browser-log.mjs
      - name: Upload browser log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-log-${{ matrix.os }}-node-${{ matrix.node }}
          path: .local/browser
          if-no-files-found: ignore
          retention-days: 7
